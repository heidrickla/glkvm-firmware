name: Validate

# Runs on the self-hosted act_runner on forgehost. GitHub Actions is unavailable
# (spend cap), so .github/workflows/ci.yml is parked on workflow_dispatch and
# this is the pipeline that actually gates the repo.
#
# THE RUNNER IS SHARED AND ITS CAPACITY IS 1. Other agent sessions queue behind
# anything pushed here, so an ordinary push runs ONE fast job. Nothing slow goes
# on the push path.
#
# FAILS LOUDLY, ON PURPOSE.
#
# Every bug in this repo that cost real time was a silent success, not a crash:
# a script that discarded a child's output and reported "applied" while patching
# nothing; a loop that handled one of three items and exited 0. So:
#
#   * every `run` uses `set -euo pipefail`, so a failure mid-pipe is not masked
#     by the exit status of whatever came after it
#   * selftest runs with `--ci`, which turns a SKIPPED check into a FAILURE. A
#     check that could not run has verified nothing, and a runner can install
#     whatever it needs. Only two skips survive --ci: gitignored build artifacts
#     and the absence of a real KVM
#   * no step uses continue-on-error
#   * shellcheck is PINNED. An unpinned linter makes CI non-reproducible, and
#     that has already been paid for once on the sleepiq repo

on:
  push:
  pull_request:
  workflow_dispatch:

# EVERY run block here uses `set -euo pipefail` and one uses process
# substitution, and neither is POSIX. The runner's default shell is not bash, so
# without this the FIRST LINE of every step fails with "Illegal option -o
# pipefail" — which presents as a red job with no output at all, since the step
# dies before it can print anything.
#
# Every other workflow on this runner sidesteps it by using plain commands with
# no `set -e`; this repo wants the strict shell, so it asks for bash explicitly.
defaults:
  run:
    shell: bash

jobs:
  validate:
    name: Tooling selftest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # EVERYTHING IS TEED TO ci.log AND UPLOADED, PASS OR FAIL.
      #
      # This Gitea (1.24.7) exposes no usable job-log API: /actions/runs 404s,
      # /actions/jobs/{id}/logs 404s, and the web route the UI uses wants a CSRF
      # token. So a red job is a red square with no reason attached, and the
      # only honest way to debug it was to guess. An uploaded artifact is
      # readable through /api/v1/repos/{owner}/{repo}/actions/artifacts.
      #
      # The step is written not to fail; the recorded status is re-raised at the
      # end, AFTER the upload has run.
      - name: Environment, install and selftest (captured)
        id: run
        run: |
          set -uo pipefail
          exec > >(tee -a ci.log) 2>&1
          echo "=== environment ==="
          echo "uname     : $(uname -a)"
          echo "whoami    : $(whoami)"
          . /etc/os-release 2>/dev/null && echo "distro    : ${PRETTY_NAME:-unknown}"
          echo "python3   : $(command -v python3 || echo MISSING) $(python3 -V 2>&1 || true)"
          echo "pip module: $(python3 -m pip --version 2>&1 | head -1)"
          echo "shellcheck: $(command -v shellcheck || echo 'not preinstalled')"
          echo "PATH      : $PATH"

          echo "=== install (pinned) ==="
          # Not apt: every other workflow on this runner is pip-only. Try the
          # pip module, then ensurepip, then apt as a last resort -- and say
          # which one worked, because that is the fact that was missing.
          rc=0
          python3 -m pip install --quiet --upgrade pip 2>&1 || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "python3 -m pip unavailable (rc=$rc); trying ensurepip"
            python3 -m ensurepip --upgrade 2>&1 || echo "ensurepip failed too"
          fi
          python3 -m pip install --quiet --break-system-packages \
              "shellcheck-py==0.10.0.1" "PyYAML==6.0.2" 2>&1 \
            || python3 -m pip install --quiet "shellcheck-py==0.10.0.1" "PyYAML==6.0.2" 2>&1 \
            || { echo "pip install failed; falling back to apt"; \
                 sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck python3-yaml; }

          # pip console scripts often land outside PATH on runner images.
          for d in "$HOME/.local/bin" /usr/local/bin; do
            [ -d "$d" ] && case ":$PATH:" in *":$d:"*) ;; *) PATH="$d:$PATH" ;; esac
          done
          export PATH
          echo "shellcheck now: $(command -v shellcheck || echo STILL MISSING)"
          shellcheck --version 2>&1 | head -2 || true
          python3 -c "import yaml; print('pyyaml', yaml.__version__)" 2>&1 || true

          echo "=== selftest --ci ==="
          ./tools/selftest.sh --ci
          echo "SELFTEST_RC=$?" | tee ci.rc

      - name: Upload the log whatever happened
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: ci-log
          path: |
            ci.log
            ci.rc

      # Re-raise the real result only after the log is safely uploaded.
      - name: Fail if the selftest failed
        if: always()
        run: |
          set -euo pipefail
          rc=$(sed -n 's/^SELFTEST_RC=//p' ci.rc 2>/dev/null | tail -1)
          echo "recorded selftest rc: ${rc:-<none>}"
          if [ "${rc:-1}" != "0" ]; then
            echo "::error::selftest failed - download the ci-log artifact for the reason"
            exit 1
          fi

      # The device checks are deliberately NOT here. The runner has no route to
      # the KVMs and no key for them, and a CI job that quietly cannot reach
      # hardware is exactly the false green this repo keeps getting bitten by.
      # Run them from a workstation instead:
      #     ./tools/selftest.sh --with-device 192.0.2.15
      - name: Note what was not covered
        run: |
          set -euo pipefail
          echo "Hardware checks were NOT run here (no route to the KVMs from this runner)."
          echo "Run './tools/selftest.sh --with-device <ip>' from a workstation for those."

  # Runs selftest seven times over a mutated copy of the tree, so it is far too
  # slow for the shared runner's push path. Manual only.
  #
  # It answers the question selftest cannot ask about itself: can these checks
  # fail at all? It breaks each thing selftest claims to verify and asserts the
  # suite goes red, then runs an unmodified copy as a positive control — a suite
  # that fails on everything proves as little as one that fails on nothing.
  verify-gates:
    name: Prove the gates can fail
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install shellcheck and PyYAML (PINNED)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet "shellcheck-py==0.10.0.1" "PyYAML==6.0.2"

      - name: Inject violations and require each to be caught
        run: |
          set -euo pipefail
          ./tools/verify-gates.sh
