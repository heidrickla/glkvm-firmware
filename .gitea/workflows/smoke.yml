name: Smoke

# DIAGNOSTIC, NOT A CHECK. Delete once validate.yml is green.
#
# This Gitea exposes no job logs to the API and the artifacts endpoint returns
# nothing, so the ONLY channel back from a run is per-job success/failure. These
# jobs therefore encode the question in the job name and the answer in its
# status: whichever goes red names the missing piece.
#
# Established so far, each by a job that passed: the runner executes steps;
# actions/checkout@v3 works; a declared bash shell with `set -euo pipefail` and
# process substitution works; actions/upload-artifact@v3 works. So the fault is
# inside validate.yml's real work, not its scaffolding.

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  a-pip-module-exists:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          python3 -m pip --version

  b-pip-can-install-pinned:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          python3 -m pip install --quiet "shellcheck-py==0.10.0.1" "PyYAML==6.0.2"

  c-shellcheck-on-path-after-pip:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          python3 -m pip install --quiet "shellcheck-py==0.10.0.1"
          command -v shellcheck
          shellcheck --version

  d-selftest-plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          set -euo pipefail
          ./tools/selftest.sh

  e-selftest-ci-strict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          set -euo pipefail
          python3 -m pip install --quiet "shellcheck-py==0.10.0.1" "PyYAML==6.0.2"
          export PATH="$HOME/.local/bin:$PATH"
          ./tools/selftest.sh --ci

  f-repo-files-are-executable:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: |
          set -euo pipefail
          # A Windows-authored repo can land here without the exec bit, and
          # "./tools/selftest.sh: Permission denied" would fail every run.
          test -x tools/selftest.sh
          test -x tools/verify-gates.sh
          test -x tools/provision.sh
