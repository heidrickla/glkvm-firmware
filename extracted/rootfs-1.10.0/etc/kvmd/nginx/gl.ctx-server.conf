absolute_redirect off;

index index.html;

auth_request /auth_check;
auth_request_set $auth_token $arg_auth_token;

location = /auth_check {
	internal;

	# 从原始请求 URI 中提取 auth_token（$arg_auth_token 在子请求中为空）
	set $original_auth_token "";
	if ($request_uri ~ "[?&]auth_token=([^&]+)") {
		set $original_auth_token $1;
	}

	set $auth_check_uri /auth/check;
	if ($original_auth_token != "") {
		set $auth_check_uri /auth/check?auth_token=$original_auth_token;
	}
	proxy_pass http://kvmd$auth_check_uri;
	client_max_body_size 0;
	proxy_pass_request_body off;
	proxy_set_header Content-Length "";
	proxy_set_header X-Original-URI $request_uri;
    proxy_set_header Authorization $http_authorization;  
	auth_request off;
}

include /etc/kvmd/nginx/webdav.conf;

location / {
	root /usr/share/kvmd/glweb;
	include /etc/kvmd/nginx/loc-login.conf;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location @login {
	return 302 /login;
}

location /login {
	root /usr/share/kvmd/glweb;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location /share {
	root /usr/share/kvmd/glweb;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location = /share/css/user.css {
	alias /etc/kvmd/web.css;
	auth_request off;
}

location = /favicon.ico {
	alias /usr/share/kvmd/glweb/favicon.ico;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location = /robots.txt {
	alias /usr/share/kvmd/glweb/robots.txt;
	include /etc/kvmd/nginx/loc-nocache.conf;
	auth_request off;
}

location /api/ws {
	rewrite ^/api/ws$ /ws break;
	rewrite ^/api/ws\?(.*)$ /ws?$1 break;
	proxy_pass http://kvmd;
	include /etc/kvmd/nginx/loc-proxy.conf;
	include /etc/kvmd/nginx/loc-websocket.conf;
	auth_request off;
}

