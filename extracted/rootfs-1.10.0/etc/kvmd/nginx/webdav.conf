# WebDAV location
location /dav/ {
    include /etc/kvmd/nginx/loc-webdav-cors.conf;

    auth_request /auth_check;

    # 认证失败时返回 401 并带上 WWW-Authenticate
    # 这样 WebDAV 客户端才会弹出用户名密码框
    error_page 401 = @dav_unauthorized;

    client_max_body_size 0;
    proxy_request_buffering off;

    proxy_set_header Destination $http_destination;
    proxy_set_header Depth $http_depth;
    proxy_set_header Overwrite $http_overwrite;

    proxy_pass http://127.0.0.1:8080/;
}

location @dav_unauthorized {
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header WWW-Authenticate 'Basic realm="WebDAV"' always;
    return 401;
}
